version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanyu-card
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      SESSION_SECRET: nanyu-card-secret
      DB_PATH: /app/data/app.json
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
